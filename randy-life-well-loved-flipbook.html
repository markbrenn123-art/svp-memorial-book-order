<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Life Well-Loved — Randy — Flip Through</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Comfortaa:wght@400;500&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f8f2e3;
    --cream-deep:#efe6cf;
    --brown:#4a3527;
    --brown-soft:#6b5340;
    --sage:#8a9470;
    --shadow: rgba(74,53,39,0.28);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:transparent;
    font-family:'Patrick Hand', cursive;
    color:var(--brown);
    overflow:hidden;
  }
  .wrap{
    width:100%;
    height:100%;
    min-height:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:18px 10px 22px;
    background:
      radial-gradient(ellipse at 50% 15%, var(--cream) 0%, var(--cream-deep) 100%);
  }

  .titlebar{
    font-family:'Chewy', cursive;
    color:var(--brown);
    font-size:clamp(18px,3vw,26px);
    letter-spacing:0.5px;
    text-align:center;
    line-height:1.15;
    -webkit-user-select:none;user-select:none;
  }
  .titlebar span{
    display:block;
    font-family:'Patrick Hand', cursive;
    font-size:0.5em;
    color:var(--brown-soft);
    margin-top:2px;
  }
  .back-link{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--brown-soft);
    text-decoration:underline;
    -webkit-user-select:none;user-select:none;
  }

  .stage{
    position:relative;
    width:min(92vw, 80vh, 780px);
    aspect-ratio:1.95/1;
    perspective:2600px;
    -webkit-user-select:none;user-select:none;
  }

  .book-shadow{
    position:absolute;
    left:4%;right:4%;bottom:-16px;
    height:26px;
    background:radial-gradient(ellipse at center, var(--shadow) 0%, transparent 72%);
    filter:blur(2px);
    z-index:0;
  }

  .leaf-holder{
    position:relative;
    width:100%;height:100%;
    transform-style:preserve-3d;
    border-radius:8px;
    box-shadow:0 18px 40px -12px var(--shadow), 0 4px 10px rgba(74,53,39,0.18);
    background:#fff;
    overflow:hidden;
  }

  .leaf{
    position:absolute; inset:0;
    backface-visibility:hidden;
    transform-origin:left center;
    background:var(--cream);
    display:flex;
  }
  .leaf .side{
    position:relative;
    width:50%; height:100%;
    overflow:hidden;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .leaf .side > img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  /* single-image cover spread mode: hide the right half entirely so the
     left half's flex width:100% doesn't get shrunk to 50/50 by its sibling */
  .leaf.is-cover .side{ display:none; }
  .leaf.is-cover .side:first-child{ display:flex; width:100%; }
  .leaf.is-cover .side > img{ object-fit:contain; background:var(--cream); }

  .page-story{
    font-family:'Comfortaa', sans-serif;
    font-weight:500;
    color:var(--brown);
    text-align:center;
    padding:13% 13% 0;
    position:relative;
    width:100%;height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    background:
      radial-gradient(ellipse 55% 40% at 18% 18%, rgba(120,105,80,0.07), transparent 60%),
      radial-gradient(ellipse 60% 45% at 85% 82%, rgba(120,105,80,0.06), transparent 60%),
      var(--cream);
  }
  .page-story-text{
    font-size:clamp(10px,1.45vw,14px);
    line-height:1.75;
    letter-spacing:0.2px;
  }
  .title-block{ margin-bottom:16px; }
  .title-block-heading{
    font-family:'Chewy', cursive;
    font-size:clamp(16px,2.6vw,22px);
    color:var(--brown);
    margin-bottom:2px;
  }
  .title-block-sub{
    font-family:'Comfortaa', sans-serif;
    font-size:clamp(9px,1.3vw,12px);
    color:var(--brown-soft);
    margin-bottom:10px;
  }
  .title-block-paw{
    width:14%;
    max-width:46px;
    display:block;
    margin:0 auto;
    opacity:0.9;
  }
  .pgnum-img{
    position:absolute;left:12px;bottom:10px;
    font-family:'Comfortaa', sans-serif;
    font-size:11px;
    color:#fdf9ef;
    background:rgba(60,45,30,0.45);
    padding:2px 8px;
    border-radius:10px;
    letter-spacing:0.3px;
  }
  .closing-page{
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:8%;
    background:var(--cream);
  }
  .closing-heading{
    font-family:'Chewy', cursive;
    font-size:clamp(20px,3.4vw,30px);
    color:var(--brown);
  }
  .closing-belongs{
    font-family:'Comfortaa', sans-serif;
    font-size:clamp(11px,1.6vw,15px);
    color:var(--brown-soft);
    margin-top:14px;
  }
  .closing-line{
    width:60%;
    border-bottom:1.5px solid var(--brown-soft);
    opacity:.5;
    margin:8px 0 14px;
  }
  .closing-footer{
    font-family:'Comfortaa', sans-serif;
    font-size:clamp(9px,1.2vw,11px);
    color:var(--brown-soft);
    opacity:.8;
    line-height:1.6;
  }

  .gutter{
    position:absolute;
    top:0; bottom:0; left:50%;
    width:22px; margin-left:-11px;
    z-index:6;
    pointer-events:none;
    background:linear-gradient(90deg,
      rgba(0,0,0,0.10), rgba(0,0,0,0) 30%,
      rgba(0,0,0,0) 70%, rgba(0,0,0,0.10));
    transition:opacity 0.2s ease;
  }
  .gutter.hidden{ opacity:0; }

  #leafBase{ z-index:1; }
  #leafTop{
    z-index:3;
    transition: transform 0.66s cubic-bezier(.45,.05,.35,1);
  }
  #leafTop.flipping-fwd{ transform:rotateY(-178deg); }
  #leafTop::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,0.14), transparent 30%, transparent 70%, rgba(0,0,0,0.08));
    opacity:0;
    transition:opacity 0.66s ease;
    pointer-events:none;
  }
  #leafTop.flipping-fwd::after{ opacity:1; }

  .tapzone{
    position:absolute; top:0; bottom:0; width:32%;
    z-index:10; cursor:pointer;
    background:transparent;
  }
  .tapzone.left{ left:0; }
  .tapzone.right{ right:0; }

  .cover-cta{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cover-cta button{
    font-family:'Chewy', cursive;
    font-size:clamp(15px,2.4vw,20px);
    color:#fffaf0;
    background:var(--brown);
    border:none;
    padding:12px 26px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,0.28);
    letter-spacing:0.5px;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .cover-cta button:hover{ transform:translateY(-2px) scale(1.03); background:#5c4433; }
  .cover-cta button:active{ transform:translateY(0) scale(0.98); }

  .controls{
    display:flex;
    align-items:center;
    gap:16px;
    -webkit-user-select:none;user-select:none;
  }
  .arrow-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:2px solid var(--brown);
    background:var(--cream);
    color:var(--brown);
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background 0.15s ease, transform 0.1s ease;
    flex:none;
  }
  .arrow-btn:hover{ background:var(--brown); color:var(--cream); }
  .arrow-btn:active{ transform:scale(0.92); }
  .arrow-btn:disabled{ opacity:0.35; cursor:default; background:var(--cream); color:var(--brown); }

  .page-count{
    font-size:16px;
    color:var(--brown-soft);
    min-width:100px;
    text-align:center;
  }

  .scrub-row{
    width:min(92vw,780px);
    display:flex;
    align-items:center;
    gap:10px;
  }
  input[type="range"]{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:6px;
    border-radius:6px;
    background:var(--cream-deep);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--sage);
    border:2px solid var(--brown);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--sage);
    border:2px solid var(--brown);
    cursor:pointer;
  }

  .hint{
    font-size:13px;
    color:var(--brown-soft);
    opacity:0.8;
  }

  @media (prefers-reduced-motion: reduce){
    #leafTop{ transition:none; }
    #leafTop::after{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">A Life Well-Loved — Randy<span>tap the pages to flip through &middot; made by Sun Valley Pet</span></div>
  <a class="back-link" href="https://sunvalleypet.com" target="_blank" rel="noopener">&larr; Back to Sun Valley Pet</a>

  <div class="stage" id="stage">
    <div class="book-shadow"></div>
    <div class="leaf-holder" id="leafHolder">
      <div class="leaf is-cover" id="leafBase">
        <div class="side" id="baseLeft"></div>
        <div class="side" id="baseRight"></div>
      </div>
      <div class="leaf is-cover" id="leafTop">
        <div class="side" id="topLeft"></div>
        <div class="side" id="topRight"></div>
      </div>
      <div class="gutter hidden" id="gutter"></div>
    </div>
    <div class="tapzone left" id="zoneLeft"></div>
    <div class="tapzone right" id="zoneRight"></div>
    <div class="cover-cta" id="coverCta"><button id="openBtn">Open the Book</button></div>
  </div>

  <div class="controls">
    <button class="arrow-btn" id="prevBtn" aria-label="Previous page">&#8249;</button>
    <div class="page-count" id="pageCount">Cover</div>
    <button class="arrow-btn" id="nextBtn" aria-label="Next page">&#8250;</button>
  </div>

  <div class="scrub-row">
    <input type="range" id="scrubber" min="0" max="16" value="0">
  </div>
  <div class="hint">Swipe, click the arrows, or drag the slider</div>
</div>

<script>
var COVER_SRC = "assets/memorial-sample-cover.jpg";
var TITLEPAGE_SRC = "assets/memorial-01-pawprint.jpg";

var SCENES = [
  { img: "assets/memorial-02-comehome.jpg", text: "The day Randy came into our lives,
everything changed.
We just didn't know yet
how much.", pageNum: 2 },
  { img: "assets/memorial-03-puppydays.jpg", text: "Every corner of the yard
was a whole new world.
We got to discover it
together.", pageNum: 4 },
  { img: "assets/memorial-04-bestfriend.jpg", text: "That first favorite toy.
Randy carried it everywhere,
like it was the greatest treasure
in the world.", pageNum: 6 },
  { img: "assets/memorial-05-wildflowers.jpg", text: "Ears flying, feet flying,
Randy ran like the whole field
belonged to him alone.
For a while, it did.", pageNum: 8 },
  { img: "assets/memorial-10-quietafternoon.jpg", text: "There was always a favorite spot —
the one patch of sun
that was somehow always Randy's.", pageNum: 10 },
  { img: "assets/memorial-06-waterplay.jpg", text: "Splashing, soaked, completely thrilled —
Randy never once
worried about getting wet.", pageNum: 12 },
  { img: "assets/memorial-12-sunlitsleep.jpg", text: "A warm sunbeam, a soft sigh,
and Randy was exactly
where he wanted to be.", pageNum: 14 },
  { img: "assets/memorial-14-lastgoodbye.jpg", text: "The best sound in the world?
The front door opening.
Randy made sure we knew it, every time.", pageNum: 16 },
  { img: "assets/memorial-08-couch.jpg", text: "Some evenings didn't need words.
Just Randy, close by,
steady and warm.", pageNum: 18 },
  { img: "assets/memorial-11-fireside.jpg", text: "The years moved gently,
and so did Randy —
a little slower, a little grayer,
just as loved.", pageNum: 20 },
  { img: "assets/memorial-07-eveningwalk.jpg", text: "One more walk.
One more golden evening
with Randy by our side.", pageNum: 22 },
  { img: "assets/memorial-09-undertree.jpg", text: "And then, gently,
Randy found rest —
peaceful, warm, and loved
to the very last moment.", pageNum: 24 },
  { img: "assets/memorial-16-rainbowbridge.jpg", text: "Somewhere beyond, Randy runs again —
young and free,
beneath a gentle rainbow,
waiting for us.", pageNum: 26 },
  { img: "assets/memorial-15-leash.jpg", text: "The leash still hangs by the door.
We haven't moved it.
We're not sure we ever will.", pageNum: 28 },
  { img: "assets/memorial-13-heartlight.jpg", text: "A house is quieter now,
but never empty —
not with this much love
still living in it.", pageNum: 30 },
];

(function(){
  // Spread 0 = closed cover (single wide cover image).
  // Spread 1..15 = one story scene each: left page = story text
  // (spread 1 also carries the title-page treatment), right page =
  // full-bleed illustration with its printed page number.
  // Spread 16 = closing page.
  var LAST_SPREAD = SCENES.length + 1; // 15 story spreads + 1 closing spread

  var current = 0;
  var animating = false;

  var stage = document.getElementById('stage');
  var leafBase = document.getElementById('leafBase');
  var leafTop = document.getElementById('leafTop');
  var baseLeft = document.getElementById('baseLeft');
  var baseRight = document.getElementById('baseRight');
  var topLeft = document.getElementById('topLeft');
  var topRight = document.getElementById('topRight');
  var gutter = document.getElementById('gutter');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var pageCount = document.getElementById('pageCount');
  var scrubber = document.getElementById('scrubber');
  var coverCta = document.getElementById('coverCta');
  var openBtn = document.getElementById('openBtn');
  var zoneLeft = document.getElementById('zoneLeft');
  var zoneRight = document.getElementById('zoneRight');

  var TITLE_BLOCK =
    '<div class="title-block">' +
      '<div class="title-block-heading">A Life Well-Loved</div>' +
      '<div class="title-block-sub">Randy &middot; 2014&ndash;2026</div>' +
      '<img class="title-block-paw" src="' + TITLEPAGE_SRC + '" alt="">' +
    '</div>';

  function renderTextPage(el, text, titleBlockHtml){
    el.innerHTML = '<div class="page-story">' +
      (titleBlockHtml || '') +
      '<div class="page-story-text">' + text.replace(/\n/g, '<br>') + '</div>' +
      '</div>';
  }
  function renderImagePage(el, src, pageNum){
    el.innerHTML = '<img src="' + src + '" alt="">' +
      (pageNum ? '<span class="pgnum-img">' + pageNum + '</span>' : '');
  }
  function renderCoverPage(el, src){
    el.innerHTML = '<img src="' + src + '" alt="A Life Well-Loved: Randy\u2019s Story cover">';
  }
  function renderClosingPage(el){
    el.innerHTML =
      '<div class="closing-page">' +
        '<div class="closing-heading">Until We Meet Again</div>' +
        '<div class="closing-belongs">This book belongs to</div>' +
        '<div class="closing-line"></div>' +
        '<div class="closing-footer">Randy &middot; 2014&ndash;2026 &middot; Forever loved.<br>Made with love by Sun Valley Pet &middot; sunvalleypet.com</div>' +
      '</div>';
  }

  function fillLeaf(leafEl, leftEl, rightEl, k){
    if (k === 0){
      leafEl.classList.add('is-cover');
      renderCoverPage(leftEl, COVER_SRC);
      rightEl.innerHTML = '';
    } else if (k <= SCENES.length){
      leafEl.classList.remove('is-cover');
      var sc = SCENES[k - 1];
      renderTextPage(leftEl, sc.text, k === 1 ? TITLE_BLOCK : '');
      renderImagePage(rightEl, sc.img, sc.pageNum);
    } else {
      // closing spread
      leafEl.classList.remove('is-cover');
      leftEl.innerHTML = '';
      renderClosingPage(rightEl);
    }
  }

  function updateLabel(){
    if (current === 0){
      pageCount.textContent = 'Cover';
      gutter.classList.add('hidden');
    } else if (current === LAST_SPREAD){
      pageCount.textContent = 'The End';
      gutter.classList.remove('hidden');
    } else {
      pageCount.textContent = 'pp. ' + (2*current) + '\u2013' + (2*current+1);
      gutter.classList.remove('hidden');
    }
    prevBtn.disabled = (current <= 0);
    nextBtn.disabled = (current >= LAST_SPREAD);
    scrubber.value = current;
  }

  function goTo(k, animate){
    if (animating) return;
    k = Math.max(0, Math.min(LAST_SPREAD, k));
    if (k === current) return;

    if (!animate){
      current = k;
      fillLeaf(leafBase, baseLeft, baseRight, current);
      fillLeaf(leafTop, topLeft, topRight, current);
      leafTop.classList.remove('flipping-fwd');
      updateLabel();
      return;
    }

    animating = true;

    // Top leaf shows the outgoing spread and swings away to reveal
    // the target spread (already loaded on the base leaf) underneath.
    fillLeaf(leafBase, baseLeft, baseRight, k);
    fillLeaf(leafTop, topLeft, topRight, current);

    leafTop.style.transition = 'none';
    leafTop.classList.remove('flipping-fwd');
    void leafTop.offsetWidth; // force reflow
    leafTop.style.transition = '';
    requestAnimationFrame(function(){
      leafTop.classList.add('flipping-fwd');
    });
    setTimeout(function(){
      current = k;
      fillLeaf(leafTop, topLeft, topRight, current);
      leafTop.classList.remove('flipping-fwd');
      leafTop.style.transition = 'none';
      void leafTop.offsetWidth;
      leafTop.style.transition = '';
      animating = false;
      updateLabel();
    }, 680);
  }

  openBtn.addEventListener('click', function(){
    coverCta.style.display = 'none';
    goTo(1, true);
  });

  nextBtn.addEventListener('click', function(){
    if (current === 0){ openBtn.click(); return; }
    goTo(current + 1, true);
  });
  prevBtn.addEventListener('click', function(){
    goTo(current - 1, true);
  });

  zoneRight.addEventListener('click', function(){
    if (current === 0){ openBtn.click(); return; }
    goTo(current + 1, true);
  });
  zoneLeft.addEventListener('click', function(){
    if (current === 0){ return; }
    goTo(current - 1, true);
  });

  scrubber.addEventListener('input', function(){
    var k = parseInt(scrubber.value, 10);
    if (k > 0) coverCta.style.display = 'none';
    goTo(k, false);
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ nextBtn.click(); }
    if (e.key === 'ArrowLeft'){ prevBtn.click(); }
  });

  // swipe support
  var touchStartX = null;
  stage.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40){
      if (dx < 0){ nextBtn.click(); } else { prevBtn.click(); }
    }
    touchStartX = null;
  }, {passive:true});

  // initial fill
  fillLeaf(leafBase, baseLeft, baseRight, 0);
  fillLeaf(leafTop, topLeft, topRight, 0);
  updateLabel();
})();
</script>
</body>
</html>
