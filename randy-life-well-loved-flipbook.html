<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Life Well-Loved — Randy — Flip Through</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Comfortaa:wght@400;500&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f8f2e3;
    --cream-deep:#efe6cf;
    --brown:#4a3527;
    --brown-soft:#6b5340;
    --sage:#8a9470;
    --shadow: rgba(74,53,39,0.28);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:transparent;
    font-family:'Patrick Hand', cursive;
    color:var(--brown);
    overflow:hidden;
  }
  .wrap{
    width:100%;
    height:100%;
    min-height:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:18px 10px 22px;
    background:
      radial-gradient(ellipse at 50% 15%, var(--cream) 0%, var(--cream-deep) 100%);
  }

  .titlebar{
    font-family:'Chewy', cursive;
    color:var(--brown);
    font-size:clamp(18px,3vw,26px);
    letter-spacing:0.5px;
    text-align:center;
    line-height:1.15;
    -webkit-user-select:none;user-select:none;
  }
  .titlebar span{
    display:block;
    font-family:'Patrick Hand', cursive;
    font-size:0.5em;
    color:var(--brown-soft);
    margin-top:2px;
  }
  .back-link{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--brown-soft);
    text-decoration:underline;
    -webkit-user-select:none;user-select:none;
  }

  .stage{
    position:relative;
    width:min(92vw, 80vh, 780px);
    aspect-ratio:1.95/1;
    perspective:2600px;
    -webkit-user-select:none;user-select:none;
  }

  .book-shadow{
    position:absolute;
    left:4%;right:4%;bottom:-16px;
    height:26px;
    background:radial-gradient(ellipse at center, var(--shadow) 0%, transparent 72%);
    filter:blur(2px);
    z-index:0;
  }

  .leaf-holder{
    position:relative;
    width:100%;height:100%;
    transform-style:preserve-3d;
    border-radius:8px;
    box-shadow:0 18px 40px -12px var(--shadow), 0 4px 10px rgba(74,53,39,0.18);
    background:#fff;
    overflow:hidden;
  }

  .leaf{
    position:absolute; inset:0;
    backface-visibility:hidden;
    transform-origin:left center;
    background:var(--cream);
    display:flex;
  }
  .leaf .side{
    position:relative;
    width:50%; height:100%;
    overflow:hidden;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .leaf .side img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  /* single-image cover spread mode: hide the right half entirely so the
     left half's flex width:100% doesn't get shrunk to 50/50 by its sibling */
  .leaf.is-cover .side{ display:none; }
  .leaf.is-cover .side:first-child{ display:flex; width:100%; }
  .leaf.is-cover .side img{ object-fit:contain; background:var(--cream); }

  .page-story{
    font-family:'Comfortaa', sans-serif;
    font-weight:500;
    font-size:clamp(10px,1.45vw,14px);
    line-height:1.75;
    letter-spacing:0.2px;
    color:var(--brown);
    text-align:center;
    padding:0 15%;
    position:relative;
    width:100%;height:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding-top:22%;
    background:
      radial-gradient(ellipse 55% 40% at 18% 18%, rgba(120,105,80,0.07), transparent 60%),
      radial-gradient(ellipse 60% 45% at 85% 82%, rgba(120,105,80,0.06), transparent 60%),
      var(--cream);
  }
  .page-story .pgnum{
    position:absolute;left:14px;bottom:12px;
    font-family:'Comfortaa', sans-serif;
    font-size:10px;color:#5b7d82;opacity:.75;
  }

  .gutter{
    position:absolute;
    top:0; bottom:0; left:50%;
    width:22px; margin-left:-11px;
    z-index:6;
    pointer-events:none;
    background:linear-gradient(90deg,
      rgba(0,0,0,0.10), rgba(0,0,0,0) 30%,
      rgba(0,0,0,0) 70%, rgba(0,0,0,0.10));
    transition:opacity 0.2s ease;
  }
  .gutter.hidden{ opacity:0; }

  #leafBase{ z-index:1; }
  #leafTop{
    z-index:3;
    transition: transform 0.66s cubic-bezier(.45,.05,.35,1);
  }
  #leafTop.flipping-fwd{ transform:rotateY(-178deg); }
  #leafTop::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,0.14), transparent 30%, transparent 70%, rgba(0,0,0,0.08));
    opacity:0;
    transition:opacity 0.66s ease;
    pointer-events:none;
  }
  #leafTop.flipping-fwd::after{ opacity:1; }

  .tapzone{
    position:absolute; top:0; bottom:0; width:32%;
    z-index:10; cursor:pointer;
    background:transparent;
  }
  .tapzone.left{ left:0; }
  .tapzone.right{ right:0; }

  .cover-cta{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cover-cta button{
    font-family:'Chewy', cursive;
    font-size:clamp(15px,2.4vw,20px);
    color:#fffaf0;
    background:var(--brown);
    border:none;
    padding:12px 26px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,0.28);
    letter-spacing:0.5px;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .cover-cta button:hover{ transform:translateY(-2px) scale(1.03); background:#5c4433; }
  .cover-cta button:active{ transform:translateY(0) scale(0.98); }

  .controls{
    display:flex;
    align-items:center;
    gap:16px;
    -webkit-user-select:none;user-select:none;
  }
  .arrow-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:2px solid var(--brown);
    background:var(--cream);
    color:var(--brown);
    font-size:18px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background 0.15s ease, transform 0.1s ease;
    flex:none;
  }
  .arrow-btn:hover{ background:var(--brown); color:var(--cream); }
  .arrow-btn:active{ transform:scale(0.92); }
  .arrow-btn:disabled{ opacity:0.35; cursor:default; background:var(--cream); color:var(--brown); }

  .page-count{
    font-size:16px;
    color:var(--brown-soft);
    min-width:100px;
    text-align:center;
  }

  .scrub-row{
    width:min(92vw,780px);
    display:flex;
    align-items:center;
    gap:10px;
  }
  input[type="range"]{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:6px;
    border-radius:6px;
    background:var(--cream-deep);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--sage);
    border:2px solid var(--brown);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--sage);
    border:2px solid var(--brown);
    cursor:pointer;
  }

  .hint{
    font-size:13px;
    color:var(--brown-soft);
    opacity:0.8;
  }

  @media (prefers-reduced-motion: reduce){
    #leafTop{ transition:none; }
    #leafTop::after{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">A Life Well-Loved — Randy<span>tap the pages to flip through &middot; made by Sun Valley Pet</span></div>
  <a class="back-link" href="https://sunvalleypet.com" target="_blank" rel="noopener">&larr; Back to Sun Valley Pet</a>

  <div class="stage" id="stage">
    <div class="book-shadow"></div>
    <div class="leaf-holder" id="leafHolder">
      <div class="leaf is-cover" id="leafBase">
        <div class="side" id="baseLeft"></div>
        <div class="side" id="baseRight"></div>
      </div>
      <div class="leaf is-cover" id="leafTop">
        <div class="side" id="topLeft"></div>
        <div class="side" id="topRight"></div>
      </div>
      <div class="gutter hidden" id="gutter"></div>
    </div>
    <div class="tapzone left" id="zoneLeft"></div>
    <div class="tapzone right" id="zoneRight"></div>
    <div class="cover-cta" id="coverCta"><button id="openBtn">Open the Book</button></div>
  </div>

  <div class="controls">
    <button class="arrow-btn" id="prevBtn" aria-label="Previous page">&#8249;</button>
    <div class="page-count" id="pageCount">Cover</div>
    <button class="arrow-btn" id="nextBtn" aria-label="Next page">&#8250;</button>
  </div>

  <div class="scrub-row">
    <input type="range" id="scrubber" min="0" max="16" value="0">
  </div>
  <div class="hint">Swipe, click the arrows, or drag the slider</div>
</div>

<script>
var COVER_SRC = "assets/memorial-sample-cover.jpg";

var SCENES = [
  { img: "assets/memorial-01-pawprint.jpg", text: "Every story starts with tiny paws and a heart already full of love." },
  { img: "assets/memorial-02-comehome.jpg", text: "The day you came home, our whole world got warmer." },
  { img: "assets/memorial-03-puppydays.jpg", text: "You explored every leaf, every puddle, every corner of the yard." },
  { img: "assets/memorial-04-bestfriend.jpg", text: "You carried your favorite things everywhere — especially the ones that squeaked." },
  { img: "assets/memorial-05-wildflowers.jpg", text: "Summers were made for running through the wildflowers together." },
  { img: "assets/memorial-06-waterplay.jpg", text: "You never once said no to a splash." },
  { img: "assets/memorial-07-eveningwalk.jpg", text: "Evening walks were our favorite kind of quiet." },
  { img: "assets/memorial-08-couch.jpg", text: "Some nights, all you needed was a hand resting on your back." },
  { img: "assets/memorial-09-undertree.jpg", text: "As the years went by, you found the softest patches of shade." },
  { img: "assets/memorial-10-quietafternoon.jpg", text: "Afternoons grew slower, and sweeter, and softer." },
  { img: "assets/memorial-11-fireside.jpg", text: "You always knew exactly where the warmest spot in the house was." },
  { img: "assets/memorial-12-sunlitsleep.jpg", text: "You slept like the whole world was safe — because with us, it was." },
  { img: "assets/memorial-13-heartlight.jpg", text: "Even in your quiet last days, you filled every room with love." },
  { img: "assets/memorial-14-lastgoodbye.jpg", text: "We held you close and told you it was okay to rest." },
  { img: "assets/memorial-15-leash.jpg", text: "Your leash still hangs by the door. We're not ready to move it yet." },
  { img: "assets/memorial-16-rainbowbridge.jpg", text: "Run free now, Randy. We'll love you every day until we meet again." },
];

(function(){
  // Spread 0 = closed cover (single wide cover image).
  // Spread k (1..16) = one story scene: left page = story text,
  // right page = full-bleed illustration.
  var LAST_SPREAD = SCENES.length; // 16

  var current = 0;
  var animating = false;

  var stage = document.getElementById('stage');
  var leafBase = document.getElementById('leafBase');
  var leafTop = document.getElementById('leafTop');
  var baseLeft = document.getElementById('baseLeft');
  var baseRight = document.getElementById('baseRight');
  var topLeft = document.getElementById('topLeft');
  var topRight = document.getElementById('topRight');
  var gutter = document.getElementById('gutter');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var pageCount = document.getElementById('pageCount');
  var scrubber = document.getElementById('scrubber');
  var coverCta = document.getElementById('coverCta');
  var openBtn = document.getElementById('openBtn');
  var zoneLeft = document.getElementById('zoneLeft');
  var zoneRight = document.getElementById('zoneRight');

  function renderTextPage(el, text, pageNum){
    el.innerHTML = '<div class="page-story">' + text +
      '<span class="pgnum">' + pageNum + '</span></div>';
  }
  function renderImagePage(el, src){
    el.innerHTML = '<img src="' + src + '" alt="">';
  }
  function renderCoverPage(el, src){
    el.innerHTML = '<img src="' + src + '" alt="A Life Well-Loved: Randy\u2019s Story cover">';
  }

  function fillLeaf(leafEl, leftEl, rightEl, k){
    if (k === 0){
      leafEl.classList.add('is-cover');
      renderCoverPage(leftEl, COVER_SRC);
      rightEl.innerHTML = '';
    } else {
      leafEl.classList.remove('is-cover');
      var sc = SCENES[k - 1];
      renderTextPage(leftEl, sc.text, 2 * k);
      renderImagePage(rightEl, sc.img);
    }
  }

  function updateLabel(){
    if (current === 0){
      pageCount.textContent = 'Cover';
      gutter.classList.add('hidden');
    } else if (current === LAST_SPREAD){
      pageCount.textContent = 'The End';
      gutter.classList.remove('hidden');
    } else {
      pageCount.textContent = 'pp. ' + (2*current) + '\u2013' + (2*current+1);
      gutter.classList.remove('hidden');
    }
    prevBtn.disabled = (current <= 0);
    nextBtn.disabled = (current >= LAST_SPREAD);
    scrubber.value = current;
  }

  function goTo(k, animate){
    if (animating) return;
    k = Math.max(0, Math.min(LAST_SPREAD, k));
    if (k === current) return;

    if (!animate){
      current = k;
      fillLeaf(leafBase, baseLeft, baseRight, current);
      fillLeaf(leafTop, topLeft, topRight, current);
      leafTop.classList.remove('flipping-fwd');
      updateLabel();
      return;
    }

    animating = true;

    // Top leaf shows the outgoing spread and swings away to reveal
    // the target spread (already loaded on the base leaf) underneath.
    fillLeaf(leafBase, baseLeft, baseRight, k);
    fillLeaf(leafTop, topLeft, topRight, current);

    leafTop.style.transition = 'none';
    leafTop.classList.remove('flipping-fwd');
    void leafTop.offsetWidth; // force reflow
    leafTop.style.transition = '';
    requestAnimationFrame(function(){
      leafTop.classList.add('flipping-fwd');
    });
    setTimeout(function(){
      current = k;
      fillLeaf(leafTop, topLeft, topRight, current);
      leafTop.classList.remove('flipping-fwd');
      leafTop.style.transition = 'none';
      void leafTop.offsetWidth;
      leafTop.style.transition = '';
      animating = false;
      updateLabel();
    }, 680);
  }

  openBtn.addEventListener('click', function(){
    coverCta.style.display = 'none';
    goTo(1, true);
  });

  nextBtn.addEventListener('click', function(){
    if (current === 0){ openBtn.click(); return; }
    goTo(current + 1, true);
  });
  prevBtn.addEventListener('click', function(){
    goTo(current - 1, true);
  });

  zoneRight.addEventListener('click', function(){
    if (current === 0){ openBtn.click(); return; }
    goTo(current + 1, true);
  });
  zoneLeft.addEventListener('click', function(){
    if (current === 0){ return; }
    goTo(current - 1, true);
  });

  scrubber.addEventListener('input', function(){
    var k = parseInt(scrubber.value, 10);
    if (k > 0) coverCta.style.display = 'none';
    goTo(k, false);
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ nextBtn.click(); }
    if (e.key === 'ArrowLeft'){ prevBtn.click(); }
  });

  // swipe support
  var touchStartX = null;
  stage.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40){
      if (dx < 0){ nextBtn.click(); } else { prevBtn.click(); }
    }
    touchStartX = null;
  }, {passive:true});

  // initial fill
  fillLeaf(leafBase, baseLeft, baseRight, 0);
  fillLeaf(leafTop, topLeft, topRight, 0);
  updateLabel();
})();
</script>
</body>
</html>
